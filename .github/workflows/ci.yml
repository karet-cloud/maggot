name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  # Every push to master that passes the checks goes to production.
  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://maggot.karet.cloud
    # Never two deploys at once; a newer push waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: a sender on a domain set up for Cloudflare Email Sending turns on password reset emails.
      MAGGOT_EMAIL_FROM: ${{ vars.MAGGOT_EMAIL_FROM }}
      # Optional: JSON overrides for the rate limits and quotas in src/policy.ts.
      MAGGOT_POLICY: ${{ vars.MAGGOT_POLICY }}
      # Optional: a Turnstile widget's site key turns on the bot check for sign-up and the waitlist; its
      # secret key is the TURNSTILE_SECRET_KEY secret.
      MAGGOT_TURNSTILE_SITE_KEY: ${{ vars.MAGGOT_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Supply the stable key on every deploy, including a new or renamed Worker.
      - name: Deploy
        env:
          MAGGOT_API_KEY: ${{ secrets.MAGGOT_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$MAGGOT_API_KEY" ]; then
            echo "::error::Set MAGGOT_API_KEY in the GitHub production environment secrets before deploying."
            exit 1
          fi
          if [ -n "$MAGGOT_TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::MAGGOT_TURNSTILE_SITE_KEY is set; also set TURNSTILE_SECRET_KEY in the production environment secrets."
            exit 1
          fi
          secret_file=$(mktemp "$RUNNER_TEMP/maggot-secrets.XXXXXX")
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const secrets = { MAGGOT_API_KEY: process.env.MAGGOT_API_KEY };
            if (process.env.MAGGOT_TURNSTILE_SITE_KEY) secrets.TURNSTILE_SECRET_KEY = process.env.TURNSTILE_SECRET_KEY;
            writeFileSync(process.argv[1], JSON.stringify(secrets), { mode: 0o600 });
          ' "$secret_file"
          unset MAGGOT_API_KEY TURNSTILE_SECRET_KEY
          npx cf deploy --secrets-file "$secret_file"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w '%{http_code}' https://maggot.karet.cloud/api/me) || code=000
            [ "$code" = 200 ] && echo "API up" && exit 0
            sleep 5
          done
          echo "unexpected status $code" && exit 1

      - name: Seed public Linux demo
        env:
          MAGGOT_API_KEY: ${{ secrets.MAGGOT_API_KEY }}
          MAGGOT_MIRROR_PASSWORD: ${{ secrets.MAGGOT_MIRROR_PASSWORD }}
          MAGGOT_URL: https://maggot.karet.cloud
        run: node scripts/seed-linux-demo.ts
